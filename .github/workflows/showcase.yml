name: BambooShift Showcase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/showcase/**'
      - 'scripts/source/source-release-policy.mjs'
      - '.github/workflows/showcase.yml'

permissions:
  contents: read

concurrency:
  group: pandamate-showcase
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Stage reviewed public files only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { dirname, join } from 'node:path';
          import {
            collectReleaseFiles,
            privateReleaseValues,
            regularBytes,
            releaseFindings,
            reviewedShowcaseFiles,
          } from './scripts/source/source-release-policy.mjs';

          const prefix = 'docs/showcase/';
          const root = process.cwd();
          const files = (await collectReleaseFiles(root)).filter((file) => file.startsWith(prefix));
          if (files.length !== reviewedShowcaseFiles.size ||
              files.some((file) => !reviewedShowcaseFiles.has(file))) {
            throw Error('The showcase is missing one or more reviewed files.');
          }
          const values = await privateReleaseValues(root);
          const output = join(process.env.RUNNER_TEMP, 'pandamate-showcase');
          for (const file of files) {
            const content = await regularBytes(join(root, file), 256 * 1024);
            if (releaseFindings(file, content, values).length) {
              throw Error('Showcase privacy check failed: ' + file);
            }
            const destination = join(output, file.slice(prefix.length));
            await mkdir(dirname(destination), { recursive: true });
            await writeFile(destination, content, { flag: 'wx' });
          }
          NODE
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pandamate-showcase

  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the static showcase
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
