name: Native image codecs candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-codecs-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'
          architecture: arm64
      - name: Install locked build-only tools and check sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python -m venv "$RUNNER_TEMP/codec-tools"
          "$RUNNER_TEMP/codec-tools/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r legal/third-party/sharp-libvips-1.3.4/BUILD-TOOLS.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:source
          npm run check:privacy
          node --test scripts/desktop/native-codecs/*.test.mjs scripts/desktop/native-runtime-distribution.test.mjs
          python scripts/desktop/native-codecs/archive.test.py
      - name: Build fresh candidate from checksum-pinned public sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop/native-codecs/build.mjs build \
            --profile github-macos-15-xcode-26.3 \
            --output "$RUNNER_TEMP/codec-build" --cache "$RUNNER_TEMP/codec-sources" \
            --tools "$RUNNER_TEMP/codec-tools" --jobs 2 --fetch
          node scripts/desktop/native-codecs/build.mjs package \
            --profile github-macos-15-xcode-26.3 \
            --output "$RUNNER_TEMP/codec-build" --cache "$RUNNER_TEMP/codec-sources" \
            --tools "$RUNNER_TEMP/codec-tools"
      - name: Verify complete archives and run the isolated production image contract
        shell: bash
        run: |
          set -euo pipefail
          distribution="$RUNNER_TEMP/codec-build/distribution"
          observed_digest="$(shasum -a 256 "$distribution/distribution.json" | cut -d ' ' -f 1)"
          node scripts/desktop/native-codecs/qualify.mjs \
            "$distribution" "$observed_digest" "$RUNNER_TEMP/codec-candidate-artifacts" "$GITHUB_SHA"
          printf '%s\n' 'Candidate qualification passed. Release approval remains false; this is not a desktop release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only verified archives and sanitized qualification records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-image-codecs-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codec-candidate-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
