name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source and public configuration
        run: npm run check:source && npm run check:privacy
      - name: Check Rust and build both sites
        run: npm run build
      - name: Check a real work browser through Pi and the standalone computer Worker
        env:
          OPENBOT_BROWSER_TEST: '1'
        run: npm run backend:test -- --test computer_shared
      - name: Run backend, web, runtime and client tests
        run: npm test
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build, launch and archive the Windows x64 client
        run: node scripts/publishing/build-windows-client.mjs
      - name: Exercise isolated Chrome on Windows
        env:
          OPENBOT_BROWSER_TEST: '1'
        run: node --import tsx --test server/workers/computer-runtime/tests/browser-engine.test.ts
  mobile-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the verified Flutter source
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "OPENBOT_FLUTTER=$RUNNER_TEMP/flutter/bin/flutter" >> "$GITHUB_ENV"
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: tool/flutter.sh pub get --enforce-lockfile
      - name: Check native source and widgets without building an installer
        working-directory: mobile
        run: tool/flutter.sh analyze --no-pub && tool/flutter.sh test --no-pub
