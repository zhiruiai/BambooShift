name: BambooShift Release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
      timezone: Asia/Shanghai
    # Retry if GitHub drops the first event or a build fails.
    - cron: '43 11 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: pandamate-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source: ${{ steps.plan.outputs.source }}
      day: ${{ steps.plan.outputs.day }}
      builds: ${{ steps.plan.outputs.builds }}
      brand: ${{ steps.plan.outputs.brand }}
      package_name: ${{ steps.plan.outputs.package_name }}
      mac_bundle: ${{ steps.plan.outputs.mac_bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Select the next version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          git for-each-ref --format='%(refname:short)%09%(objecttype)%09%(subject)' refs/tags > "$RUNNER_TEMP/tags"
          node scripts/publishing/plan-release.mjs "$started" "$GITHUB_SHA" "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/tags"
          source_sha="$(sed -n 's/^source=//p' "$GITHUB_OUTPUT")"
          builds='[{"asset":"linux-x64","runner":"ubuntu-24.04"},{"asset":"macos-arm64","runner":"macos-15"}]'
          if [[ -n "$source_sha" ]]; then
            git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
            brand="$(git show "$source_sha:desktop/package.json" | jq -er '.productName | select(. == "BambooShift" or . == "MosoCrew" or . == "PandaMate")')"
            if git cat-file -e "$source_sha:scripts/publishing/package-names.mjs"; then
              package_name="$brand"
              mac_bundle="$brand"
            else
              # Pre-rename PandaMate and MosoCrew sources used the same archive format.
              package_name="PandaMate"
              mac_bundle="OpenBot"
            fi
            printf 'brand=%s\npackage_name=%s\nmac_bundle=%s\n' "$brand" "$package_name" "$mac_bundle" >> "$GITHUB_OUTPUT"
            # Older interrupted drafts resume with the formats their pinned source supports.
            if git cat-file -e "$source_sha:scripts/publishing/build-windows-client.mjs"; then
              builds="$(jq -c '. + [{asset:"windows-x64",runner:"windows-2025"}]' <<< "$builds")"
            elif [[ "$source_sha" == "$GITHUB_SHA" ]]; then
              echo "The Windows build gate is missing from the release source." >&2
              exit 1
            fi
          else
            echo "A release was already published for this Shanghai calendar day." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          printf 'builds=%s\n' "$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_PACKAGE_NAME: ${{ needs.plan.outputs.package_name }}
      RELEASE_MAC_BUNDLE: ${{ needs.plan.outputs.mac_bundle }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Stamp the version and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publishing/stamp-version.mjs "$RELEASE_VERSION"
          git add -u
          node -e '
            const { execFileSync } = require("node:child_process");
            const { mkdirSync, writeFileSync } = require("node:fs");
            const { join } = require("node:path");
            const output = join(process.env.RUNNER_TEMP, "pandamate-assets");
            mkdirSync(output);
            const tree = execFileSync("git", ["write-tree"], { encoding: "utf8" }).trim();
            writeFileSync(join(output, "source-tree.txt"), tree + "\n");
          '
          npm ci
      - name: Build and check the source and Linux server packages
        if: matrix.asset == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          assets="$RUNNER_TEMP/pandamate-assets"
          source_name="$RELEASE_PACKAGE_NAME-$RELEASE_TAG-source"
          service_name="$RELEASE_PACKAGE_NAME-$RELEASE_TAG-server-linux-x64"
          npm run check:source
          npm run check:privacy
          npm run test:source-policy
          node --test scripts/publishing/*.test.mjs scripts/source/export-source.test.mjs
          npm run source:export -- --out "release/source/$source_name"
          tar -czf "$assets/$source_name.tar.gz" -C release/source "$source_name"
          npm run build:web
          cargo fetch --locked --manifest-path server/api/Cargo.toml
          npm run backend:package -- --release --out "$RUNNER_TEMP/$service_name"
          tar -czf "$assets/$service_name.tar.gz" -C "$RUNNER_TEMP" "$service_name"
          smoke="$(mktemp -d "$RUNNER_TEMP/pandamate-smoke.XXXXXX")"
          tar -xzf "$assets/$service_name.tar.gz" -C "$smoke"
          npm ci --prefix "$smoke/$service_name/runtime" --omit=dev --ignore-scripts
          node scripts/check-backend-package.mjs "$smoke/$service_name"
      - name: Build and check the Apple Silicon client
        if: matrix.asset == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          npm run client:test
          npm run client:package -- --platform darwin --arch arm64
          client_name="$RELEASE_PACKAGE_NAME-$RELEASE_TAG-client-macos-arm64"
          app="$RUNNER_TEMP/$client_name/$RELEASE_PACKAGE_NAME.app"
          mkdir "$RUNNER_TEMP/$client_name"
          ditto --norsrc --noextattr --noqtn "release/client/$RELEASE_MAC_BUNDLE-darwin-arm64/$RELEASE_MAC_BUNDLE.app" "$app"
          cp LICENSE NOTICE THIRD_PARTY.md "$RUNNER_TEMP/$client_name/"
          codesign --verify --deep --strict "$app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = 'com.openbot.client'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")" = "$RELEASE_MAC_BUNDLE"
          test -x "$app/Contents/MacOS/$RELEASE_MAC_BUNDLE"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent "$RUNNER_TEMP/$client_name" "$RUNNER_TEMP/pandamate-assets/$client_name.zip"
      - name: Build, launch and archive the Windows x64 client
        if: matrix.asset == 'windows-x64'
        run: node scripts/publishing/build-windows-client.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bambooshift-${{ matrix.asset }}
          path: ${{ runner.temp }}/pandamate-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_SOURCE: ${{ needs.plan.outputs.source }}
      RELEASE_DAY: ${{ needs.plan.outputs.day }}
      RELEASE_BRAND: ${{ needs.plan.outputs.brand }}
      RELEASE_PACKAGE_NAME: ${{ needs.plan.outputs.package_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bambooshift-*
          path: ${{ runner.temp }}/pandamate-builds
      - name: Verify the build snapshot and publish the complete release
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:scripts/publishing/publish-release.sh" > "$RUNNER_TEMP/pandamate-publish-release.sh"
          git show "${GITHUB_SHA}:scripts/publishing/check-client-release.mjs" > "$RUNNER_TEMP/check-client-release.mjs"
          bash "$RUNNER_TEMP/pandamate-publish-release.sh"
          printf 'Published [BambooShift %s](%s/%s/releases/tag/%s).\n' \
            "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
