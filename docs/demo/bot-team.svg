<svg xmlns="http://www.w3.org/2000/svg" width="960" height="178" viewBox="0 0 960 178" role="img" aria-labelledby="title desc">
  <title id="title">BambooShift Bot team</title>
  <desc id="desc">Six colorful workspace characters share a stage, listening, thinking, working and celebrating.</desc>
  <metadata>
BambooShift composition and palette. The characters use the community GrokBot
body and expression geometry from shared/avatar-packs/grokbot in this repository.
